name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Lefthook
        env:
          LEFTHOOK_VERSION: 2.2.2
        run: |
          mkdir -p "$RUNNER_TEMP/lefthook"
          cd "$RUNNER_TEMP/lefthook"
          asset="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          release="https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}"
          curl --fail --silent --show-error --location "$release/$asset" --output "$asset"
          curl --fail --silent --show-error --location "$release/lefthook_checksums.txt" --output checksums.txt
          grep "  $asset\$" checksums.txt | sha256sum --check -
          chmod +x "$asset"
          mv "$asset" lefthook
          echo "$RUNNER_TEMP/lefthook" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: lefthook validate
      - run: bun run test
      - name: Validate pull request title and squash message
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" | bun run commitlint
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bun run commitlint
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Validate latest main commit
        if: github.event_name == 'push'
        run: bun run commitlint --last
